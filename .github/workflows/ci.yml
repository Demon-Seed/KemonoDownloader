name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-latest', 'windows-latest', 'macos-latest']
        python-version: ['3.9', '3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxkbcommon0 libxcb-xinerama0 libpulse0 libpulse-mainloop-glib0 libasound2t64 mesa-utils
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install pre-commit
        run: |
          pip install pre-commit
      - name: Run pre-commit
        run: |
          pre-commit run --all-files
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q
      - name: Upload test logs (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Make artifact name unique per matrix job and run to avoid 409 Conflict when multiple jobs upload
          name: pytest-logs-${{ matrix.os }}-${{ matrix.python-version }}-${{ github.run_id }}
          path: ./

  type-check:
    name: Type checking (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install pyright
        run: |
          npm install -g pyright
      - name: Run pyright
        run: |
          pyright --project ./pyrightconfig.json

  coverage:
    name: Coverage floor (ubuntu / 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxkbcommon0 libxcb-xinerama0 libpulse0 libpulse-mainloop-glib0 libasound2t64 mesa-utils
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests with coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q --cov=kemonodownloader --cov-report=term-missing --cov-fail-under=90

  assert-guard:
    name: Test assertions guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Compare assertion counts
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          python tools/check_test_assertions.py --base "$BASE_REF"
